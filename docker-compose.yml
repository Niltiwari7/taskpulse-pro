services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d taskpulse"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/taskpulse
      PORT: 4000
      CLIENT_ORIGIN: http://localhost:5173
      SESSION_SECRET: ${SESSION_SECRET}
    # Mount source so `tsx watch` sees edits; the anonymous volume keeps the
    # container's node_modules (argon2 is compiled for this image, not the host).
    volumes:
      - ./apps/server:/app/apps/server
      - ./packages:/app/packages
      - /app/apps/server/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/client/Dockerfile
    ports:
      - "5173:5173"
    # Mount source so Vite HMR sees edits; the anonymous volume keeps the
    # container's node_modules instead of the host's.
    volumes:
      - ./apps/client:/app/apps/client
      - ./packages:/app/packages
      - /app/apps/client/node_modules
    depends_on:
      - api

volumes:
  postgres_data: